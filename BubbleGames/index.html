<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Games | Dashboard</title>
   <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <!-- AUTH SECTION -->
    <div id="auth-screen" class="auth-container">
        <div class="bubble-card">
            <h1 class="logo-text">Bubble<span>Games</span></h1>
            <p id="auth-title" style="font-weight: bold; color: var(--bubble-blue); margin-bottom: 20px;">Welcome Back!</p>
            <input type="text" id="username" placeholder="Username" class="bouncy-input">
            <input type="password" id="password" placeholder="Password" class="bouncy-input">
            <button class="go-btn" id="main-auth-btn" onclick="handleAuth()">Let's Play!</button>
            <p class="toggle-text" style="margin-top: 15px; font-size: 14px;">
                <a href="#" onclick="switchMode()" id="toggle-link" style="color: var(--bubble-pink); text-decoration: none;">New here? Sign Up!</a>
            </p>
        </div>
    </div>

    <!-- SIDEBAR (Hidden by CSS until unlocked) -->
    <div id="sidebar" class="sidebar">
        <div id="nav-home" class="side-icon active" onclick="switchTab('home')">🏠</div>
        <div id="nav-create" class="side-icon" onclick="switchTab('create')">🧱</div>
        <div id="nav-settings" class="side-icon" onclick="switchTab('settings')">⚙️</div>
    </div>

    <!-- MAIN VIEWS (Hidden by CSS until unlocked) -->
    <div id="view-home" class="main-content">
        <h2 class="section-title">Discover Games</h2>
        <div id="global-game-list" class="game-grid">
            <!-- Games from Supabase appear here -->
        </div>
    </div>

    <div id="view-create" class="main-content" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="section-title" style="margin: 0;">Your Creations</h2>
            <button class="go-btn" style="width: auto; padding: 12px 24px;" onclick="createNewGame()">+ New Game</button>
        </div>
        <div id="user-game-list" class="game-grid">
            <!-- Your games appear here -->
        </div>
    </div>

    <div id="view-settings" class="main-content" style="display:none;">
        <h2 class="section-title">Settings</h2>
        <div class="bubble-card" style="width: 100%; max-width: 400px; text-align: left; padding: 30px;">
            <p><strong>Appearance</strong></p>
            <button onclick="toggleDarkMode()" class="go-btn" style="background: var(--bubble-blue); box-shadow: 0 6px 0 #3730a3;">Toggle Dark Mode</button>
            <button class="go-btn" onclick="handleLogout()" style="background: #ef4444; box-shadow: 0 6px 0 #991b1b; margin-top: 20px;">Logout ⏻</button>
        </div>
    </div>

    <script>
        // Simple UI Logic
        function switchTab(tabName) {
            ['view-home', 'view-create', 'view-settings'].forEach(id => document.getElementById(id).style.display = 'none');
            ['nav-home', 'nav-create', 'nav-settings'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById('view-' + tabName).style.display = 'flex';
            document.getElementById('nav-' + tabName).classList.add('active');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-theme');
        }

        // Call this function in your gateway.js after successful login!
        function unlockHub() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('view-home').style.display = 'flex';
        }
    </script>
    <script type="module" src="static/supabase.js"></script>
    <script type="module" src="static/gateway.js"></script>
</body>
</html>
